name: devwiki-labs
services:
  redis:
    image: redis:8.2.10-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${LAB_REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${LAB_RABBITMQ_USER:?需要本機實驗帳號}"
      RABBITMQ_DEFAULT_PASS: "${LAB_RABBITMQ_PASSWORD:?需要本機實驗密碼}"
      RABBITMQ_DEFAULT_VHOST: devwiki
    ports:
      - "127.0.0.1:${LAB_RABBITMQ_PORT:-5673}:5672"
      - "127.0.0.1:${LAB_RABBITMQ_MANAGEMENT_PORT:-15673}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: devwiki
      POSTGRES_USER: "${LAB_POSTGRES_USER:?需要本機實驗帳號}"
      POSTGRES_PASSWORD: "${LAB_POSTGRES_PASSWORD:?需要本機實驗密碼}"
    ports:
      - "127.0.0.1:${LAB_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped
volumes:
  redis-data:
  rabbitmq-data:
  postgres-data:
