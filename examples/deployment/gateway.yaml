apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: product-gateway
  namespace: devwiki-learning
spec:
  gatewayClassName: gke-l7-global-external-managed
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: product-route
  namespace: devwiki-learning
spec:
  parentRefs:
    - name: product-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: product-api
          port: 80
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: product-health
  namespace: devwiki-learning
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        portSpecification: USE_FIXED_PORT
        port: 8080
        requestPath: /health/ready
  targetRef:
    group: ""
    kind: Service
    name: product-api
