apiVersion: v1
kind: Namespace
metadata:
  name: devwiki-learning
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-api
  namespace: devwiki-learning
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-api
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: product-api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: product-api
          image: devwiki-product-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: product-api
  namespace: devwiki-learning
spec:
  selector:
    app: product-api
  ports:
    - name: http
      port: 80
      targetPort: http
