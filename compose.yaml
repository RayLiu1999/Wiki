name: devwiki

services:
  wiki:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${WIKI_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
